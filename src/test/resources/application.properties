# Test-specific properties (in src/test/resources) - H2 in-memory DB for integration tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create and drop schema for each test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 console for debugging (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable InitialDataLoader during tests
app.data-loader.enabled=false

# Use Spring Boot test-specific behavior
#spring.main.allow-bean-definition-overriding=true
